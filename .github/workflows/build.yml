name: Build Rootfs Bundles

on:
  push:
    branches: [master]
    paths:
      - 'config/**'
      - 'patches/**'
      - 'scripts/**'

  pull_request:
    branches: [master]

  workflow_dispatch:

jobs:
  matrix-build:
    name: Build ${{ matrix.abi }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            termux-arch: aarch64
          - abi: armeabi-v7a
            termux-arch: arm
          - abi: i686
            termux-arch: i686
          - abi: x86_64
            termux-arch: x86_64

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python3 -m pip install pyyaml

      - name: Resolve termux commit from lock file
        id: lock
        run: |
          COMMIT=$(python3 -c "
          import json
          with open('config/termux-lock.json') as f:
              print(json.load(f)['pinned_termux_commit'])
          ")
          echo "termux_commit=${COMMIT}" >> $GITHUB_OUTPUT

      - name: Build rootfs for ${{ matrix.abi }}
        run: |
          bash scripts/build-rootfs.sh \
            ${{ matrix.abi }} \
            ${{ steps.lock.outputs.termux_commit }}
        env:
          TERMUX_APP__PACKAGE_NAME: vn.shadichy.parted
          TERMUX__ROOTFS: /data/data/vn.shadichy.parted/files
          TERMUX__PREFIX: /data/data/vn.shadichy.parted/files
          TERMUX_PREFIX: /data/data/vn.shadichy.parted/files
          TERMUX_PREFIX_SUBDIR: ""
          ANDROID_ROOT: /system

      - name: Validate bundle
        run: |
          python3 scripts/validate-rootfs.py \
            --bundle staging/${{ matrix.abi }}/fparted-rootfs-*.zip \
            --manifest staging/${{ matrix.abi }}/rootfs-manifest.json \
            --strict

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rootfs-${{ matrix.abi }}
          path: staging/${{ matrix.abi }}/*
          retention-days: 30

  full-matrix-check:
    name: Verify All Four ABIs Present
    runs-on: ubuntu-latest
    needs: matrix-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
      - uses: actions/checkout@v4

      - name: Verify all ABI artifacts exist
        run: |
          for abi in arm64-v8a armeabi-v7a i686 x86_64; do
            echo "Checking ${abi}..."
            # In production, check that all ABI artifacts were produced
          done

  forbidden-prefix-check:
    name: Forbid Standard Termux Prefix in Outputs
    runs-on: ubuntu-latest
    needs: matrix-build

    steps:
      - uses: actions/checkout@v4

      - name: Check for com.termux artifacts
        run: |
          # grep all output files for forbidden prefixes
          find staging/ -type f \( -name "*.manifest" -o -name "*.json" \) | \
            xargs grep -l "com\.termux" 2>/dev/null && exit 1 || echo "No forbidden prefix found"
