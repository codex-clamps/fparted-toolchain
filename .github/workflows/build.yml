name: Build Rootfs Bundles

on:
  push:
    branches: [master]
    paths:
      - 'config/**'
      - 'patches/**'
      - 'scripts/**'
      - '.github/workflows/**'
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: build-rootfs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-all:
    name: Build ${{ matrix.abi }}
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            termux-arch: aarch64
          - abi: armeabi-v7a
            termux-arch: arm
          - abi: i686
            termux-arch: i686
          - abi: x86_64
            termux-arch: x86_64
    uses: ./.github/workflows/build-abi.yml
    with:
      abi: ${{ matrix.abi }}
      termux-arch: ${{ matrix.termux-arch }}

  build-smoke:
    name: Build x86_64 (PR smoke)
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/build-abi.yml
    with:
      abi: x86_64
      termux-arch: x86_64

  verify-all:
    name: Verify All Four ABIs Present
    needs: build-all
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Download all ABI artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Verify all four ABI bundles present
        run: |
          for abi in arm64-v8a armeabi-v7a i686 x86_64; do
            if [[ -f "artifacts/rootfs-${abi}/rootfs-${abi}.tar.gz" ]]; then
              echo "OK: ${abi}"
            else
              echo "ERROR: missing artifact for ${abi}"
              exit 1
            fi
          done

      - name: Forbid standard Termux prefix in outputs
        run: |
          mkdir -p /tmp/prefix-check
          for tarball in artifacts/*/*.tar.gz; do
            tar -xzf "${tarball}" -C /tmp/prefix-check
          done
          if find /tmp/prefix-check -type f \
              \( -name "*.json" -o -name "*.sh" -o -name "*.md" -o -name "*.txt" -o -name "*.py" \) \
              -exec grep -l "com\.termux" {} + 2>/dev/null | grep -q .; then
            echo "ERROR: forbidden com.termux prefix found"
            exit 1
          fi
          echo "No forbidden prefix found"
