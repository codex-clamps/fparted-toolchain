# Package definitions for fparted-toolchain.
# Each package must have: name, upstream URL, immutable source hash, license,
# maintainer, dependency list, patches (if any), and smoke-test command.

packages:
  parted:
    name: parted
    upstream_url: "https://gnu.org/software/parted/parted-4.4.tar.xz"
    source_hash: "sha256:PLACEHOLDER-PARTED"
    license: "GPL-3.0"
    maintainer: "fparted-tools"
    dependencies: []
    patches: []
    smoke_test: "parted --version"

  blkid:
    name: blkid
    upstream_url: "https://sourceforge.net/projects/util-linux/files/blkid/v2.40/blkid-2.40.tar.xz"
    source_hash: "sha256:PLACEHOLDER-BLKID"
    license: "GPL-2.0-or-later"
    maintainer: "fparted-tools"
    dependencies: []
    patches: []
    smoke_test: "blkid --version"

  dd:
    name: dd
    upstream_url: "https://git.savannah.gnu.org/git/core.git"
    source_hash: "sha256:PLACEHOLDER-DD"
    license: "GPL-3.0"
    maintainer: "fparted-tools"
    dependencies: []
    patches: []
    smoke_test: "dd --version"

  test:
    name: test
    upstream_url: "https://git.savannah.gnu.org/git/core.git"
    source_hash: "sha256:PLACEHOLDER-TEST"
    license: "GPL-3.0"
    maintainer: "fparted-tools"
    dependencies: []
    patches: []
    smoke_test: "test --help || true"

  e2fsprogs:
    name: e2fsprogs
    upstream_url: "https://sourceforge.net/projects/e2fsprogs/files/e2fsprogs/v1.47.2/e2fsprogs-1.47.2.tar.xz"
    source_hash: "sha256:021e5960f7c3b27dd7f2a6b0fc58489dad380dab0e6f57e32eb41c3b00b77cd4"
    license: "GPL-2.0-or-later"
    maintainer: "fparted-tools"
    dependencies: []
    patches: []
    smoke_test: "e2fsck -V"

  dosfstools:
    name: dosfstools
    upstream_url: "https://github.com/dosfstools/dosfstools/releases/download/v4.2/dosfstools-4.2.tar.gz"
