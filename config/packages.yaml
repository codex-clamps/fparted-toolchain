    source_hash: "sha256:PLACEHOLDER-F2FSTOOLS"
    license: "GPL-2.0"
    maintainer: "fparted-tools"
    dependencies: [libf2fs]
    patches: []
    smoke_test: "mkfs.f2fs -V"

  btrfs-progs:
