# fparted package build list — all packages built from source
# See PLAN.md §6 for package inclusion criteria
packages:
  parted:
    description: "Partition manipulator"
    provides: [parted]
  util-linux:
    description: "Miscellaneous system utilities"
    provides: [blkid, mkswap]
  coreutils:
    description: "GNU core utilities"
    provides: [dd, test]
  zlib:
    description: "zlib compression library (zlib-ng in Termux)"
    provides: []
  e2fsprogs:
    description: "ext2/3/4 filesystem utilities"
    provides: [e2fsck, e2image, mke2fs, resize2fs, tune2fs]
  dosfstools:
    description: "FAT filesystem utilities"
    provides: [mkfs.fat, fsck.fat, fatlabel]
  exfatprogs:
    description: "exFAT filesystem utilities"
    provides: [mkfs.exfat, fsck.exfat, exfatlabel]
  btrfs-progs:
    description: "Btrfs filesystem utilities"
    provides: [btrfs, mkfs.btrfs, btrfstune]
  libcryptsetup:
    description: "Disk encryption utility (LUKS); upstream package name for the cryptsetup binary"
    provides: [cryptsetup]
  lvm2:
    description: "LVM2 logical volume manager tools"
    provides: [lvm, pvcreate, vgcreate, lvcreate, lvremove, lvresize, pvs, vgs, lvs]
  f2fs-tools:
    description: "F2FS filesystem utilities"
    provides: [mkfs.f2fs, fsck.f2fs]
  ntfsprogs-plus:
    description: "NTFS filesystem utilities (ntfs-3g successor)"
    provides: [mkfs.ntfs, ntfsfix, ntfslabel, ntfsresize]
  xfsprogs:
    description: "XFS filesystem utilities"
    provides: [mkfs.xfs, xfs_repair, xfs_admin, xfs_growfs]
  jfsutils:
    description: "JFS filesystem utilities"
    provides: [mkfs.jfs, jfs_fsck, jfs_tune]
  hfsprogs:
    description: "HFS+ filesystem utilities"
    provides: [mkfs.hfsplus, fsck.hfsplus]
  apfsprogs:
    description: "APFS filesystem utilities"
    provides: [mkfs.apfs, mkapfs, apfs-label, apfs-snap, apfsck, fsck.apfs]
  bcachefs-tools:
    description: "BCachefs filesystem utilities"
    provides: [mkfs.bcachefs, mkfs.fuse.bcachefs, fsck.bcachefs, fsck.fuse.bcachefs, mount.bcachefs, mount.fuse.bcachefs, bcachefs]
  xorriso:
    description: "ISO 9660 Rock Ridge / Joliet filesystem manipulator"
    provides: [xorriso, xorrisofs, osirrox]
  openzfs:
    description: "OpenZFS userland filesystem utilities"
    provides: [zfs, zpool, zdb]
  libcompat:
    description: "Compatibility library for Android Bionic API 24"
    provides: []
