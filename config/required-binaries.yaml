# Required binaries that must be present in every Repo A release bundle.
# This is the source of truth shared with the fparted app (FpartedConstants.requiredBinaries).

required_binaries:
  # Partition table & layout
  - parted
  - blkid

  # Low-level disk & copy utilities
  - dd
  - test

  # ext2/3/4 filesystems (e2fsprogs)
  - e2fsck
  - mke2fs
  - resize2fs
  - tune2fs

  # FAT filesystems (dosfstools)
  - mkfs.fat
  - fsck.fat
  - fatlabel

  # exFAT filesystems (exfatprogs)
  - mkfs.exfat
  - fsck.exfat
  - exfatlabel

  # F2FS filesystems (f2fs-tools)
  - mkfs.f2fs
  - fsck.f2fs

  # Btrfs filesystems (btrfs-progs)
  - btrfs
  - mkfs.btrfs

  # NTFS filesystems (ntfsprogs-plus)
  - mkfs.ntfs
  - ntfsfix
  - ntfslabel
  - ntfsresize

  # XFS filesystems (xfsprogs)
  - mkfs.xfs
  - xfs_repair
  - xfs_admin
  - xfs_growfs

  # JFS filesystems (jfsutils)
  - mkfs.jfs
  - jfs_fsck
  - jfs_tune

  # HFS+ filesystems (hfsprogs)
  - mkfs.hfsplus
  - fsck.hfsplus

  # APFS filesystems (apfsprogs)
  - mkfs.apfs
  - mkapfs
  - apfs-label
  - apfs-snap
  - apfsck
  - fsck.apfs

  # BCachefs filesystems (bcachefs-tools)
  - mkfs.bcachefs
  - mkfs.fuse.bcachefs
  - fsck.bcachefs
  - fsck.fuse.bcachefs
  - mount.bcachefs
  - mount.fuse.bcachefs
  - bcachefs
